services:
  # Backend API
  mark-to-skill-agent-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: mark-to-skill-agent-api
    container_name: mark-to-skill-agent-api
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./tmp:/app/tmp
    environment:
      - PYTHONUNBUFFERED=1
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen3.5:9b}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - API_PORT=${API_PORT:-8000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Frontend UI
  mark-to-skill-agent-ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    image: mark-to-skill-agent-ui
    container_name: mark-to-skill-agent-ui
    ports:
      - "${UI_PORT:-3000}:80"
    environment:
      - API_URL=http://mark-to-skill-agent-api:8000
    depends_on:
      - mark-to-skill-agent-api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
